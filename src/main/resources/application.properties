
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=electronics_store

# ==========================================
# DATABASE - MARIADB
# ==========================================
spring.datasource.url=jdbc:mariadb://localhost:3306/electronics_store?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=

# MariaDB JDBC Driver
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Chỉ kiểm tra cấu trúc Entity với database hiện tại
spring.jpa.hibernate.ddl-auto=validate

# Hiển thị SQL trong Console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ==========================================
# SERVER
# ==========================================
server.port=8081
