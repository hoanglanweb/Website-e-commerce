<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khách hàng - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen flex flex-col">

    <!-- Topbar -->
    <header class="h-14 bg-white border-b border-zinc-200 px-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="font-extrabold tracking-tight text-base uppercase">Laptop Admin</span>
            <span class="text-zinc-300">/</span>
            <span class="text-xs font-semibold text-zinc-600 uppercase">Khách hàng</span>
        </div>
        <a th:href="@{/admin}" class="text-xs font-semibold text-zinc-600 hover:text-zinc-950">
            <i class="fa-solid fa-arrow-left mr-1"></i> Về Tổng quan
        </a>
    </header>

    <div class="flex flex-1 min-h-0">
        <!-- Sidebar -->
        <aside th:replace="~{Admin/fragments/admin-sidebar :: sidebar('customers')}"></aside>    

        <!-- Main Content -->
        <main class="flex-1 p-6 space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div>
                    <h1 class="text-xl font-bold text-zinc-950">Danh sách Khách hàng</h1>
                    <p class="text-xs text-zinc-500 mt-0.5">Quản lý tài khoản người dùng đã đăng ký trên hệ thống</p>
                </div>

                <!-- Ô tìm kiếm theo tên / email / SĐT -->
                <form th:action="@{/admin/customers}" method="get" class="flex items-center gap-2">
                    <input type="text"
                           name="keyword"
                           th:value="${keyword}"
                           placeholder="Tìm tên, email, SĐT..."
                           class="h-9 px-3 text-xs bg-white border border-zinc-300 focus:outline-none focus:border-zinc-950 w-56">
                    <button type="submit"
                            class="h-9 px-3.5 bg-zinc-950 text-white text-xs font-bold uppercase tracking-wider hover:bg-zinc-800 transition-colors">
                        Tìm
                    </button>
                </form>
            </div>

            <section class="bg-white border border-zinc-200">
                <div class="px-4 py-3 border-b border-zinc-200 flex items-center justify-between">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-700">Tài khoản hệ thống</h2>
                    <span class="text-xs font-semibold text-zinc-500" th:text="'Tổng: ' + ${#lists.size(customers)} + ' tài khoản'">Tổng: 0 tài khoản</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-zinc-100 text-zinc-600 uppercase border-b border-zinc-200">
                            <tr>
                                <th class="py-3 px-4">ID</th>
                                <th class="py-3 px-4">Họ tên</th>
                                <th class="py-3 px-4">Email</th>
                                <th class="py-3 px-4">Số điện thoại</th>
                                <th class="py-3 px-4">Vai trò</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-zinc-100">
                            <tr th:if="${#lists.isEmpty(customers)}">
                                <td colspan="5" class="py-8 px-4 text-center text-zinc-400">
                                    Chưa có dữ liệu khách hàng
                                </td>
                            </tr>
                            <tr th:each="u : ${customers}" class="hover:bg-zinc-50">
                                <td class="py-3 px-4 font-mono" th:text="${u.id}">1</td>
                                <td class="py-3 px-4 font-semibold text-zinc-900" th:text="${u.fullName}">Nguyễn Văn A</td>
                                <td class="py-3 px-4 text-zinc-700" th:text="${u.email}">user@example.com</td>
                                <td class="py-3 px-4 text-zinc-600" th:text="${u.phone != null ? u.phone : '-'}">-</td>
                                <td class="py-3 px-4">
                                    <span class="px-2 py-0.5 bg-zinc-100 border border-zinc-200 font-semibold text-[11px]"
                                          th:text="${u.role != null ? u.role : 'USER'}">USER</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
